name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_USE_MOCK: 'false'
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock cfn-lint
      - run: cfn-lint deploy/cloudformation.yaml
      - run: pytest -q
        working-directory: backend
      - run: pytest -q tests/deploy
  stack:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install httpx pytest
      - name: Start app and PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 180
        env:
          POSTGRES_PASSWORD: ci-local-password
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pytest -q tests/integration
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
      - name: Verify persistence across app restart
        run: python tests/integration/check_restart.py
        env:
          POSTGRES_PASSWORD: ci-local-password
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color > compose.log
        env:
          POSTGRES_PASSWORD: ci-local-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-test-results
          path: |
            playwright-report/
            test-results/
            compose.log
      - run: docker compose down -v
        if: always()
        env:
          POSTGRES_PASSWORD: ci-local-password
  image:
    if: github.event_name != 'pull_request'
    needs: stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/240103126-beep/promptshelf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-render:
    if: github.event_name != 'pull_request' && vars.RENDER_DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger configured Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
  deploy-aws:
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash deploy/aws-deploy.sh
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
          APP_IMAGE: ghcr.io/240103126-beep/promptshelf:${{ github.sha }}
