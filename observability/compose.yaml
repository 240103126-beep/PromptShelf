services:
  lgtm:
    image: grafana/otel-lgtm:0.35.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
      - '127.0.0.1:${OTEL_PORT:-4318}:4318'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - telemetry-data:/data
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/promptshelf.yaml:ro
      - ./grafana/promptshelf.json:/otel-lgtm/grafana/conf/provisioning/dashboards/promptshelf/dashboard.json:ro
      - ./grafana/alerting.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/promptshelf.yaml:ro
    networks: [default, telemetry]
  oncall:
    image: ${ONCALL_IMAGE:-promptshelf:local}
    restart: unless-stopped
    read_only: true
    command: [uvicorn, app.oncall:app, --host, 0.0.0.0, --port, '8000']
    environment:
      GEMINI_API_KEY: ${ONCALL_GEMINI_API_KEY:-}
      GEMINI_MODEL: ${ONCALL_GEMINI_MODEL:-gemini-2.5-flash}
      ONCALL_DB: /app/data/incidents.db
      GRAFANA_URL: http://lgtm:3000
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - incident-data:/app/data
networks:
  telemetry:
    name: ${PROMPTSHELF_TELEMETRY_NETWORK:-promptshelf-telemetry}
volumes:
  telemetry-data:
  incident-data:
