  /api/ai/ask:
    post:
      summary: Ai Ask
      operationId: ai_ask_api_ai_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnalyzeIn:
      properties:
        prompt:
          type: string
          minLength: 1
          title: Prompt
        response:
          type: string
          title: Response
          default: ''
        lang:
          type: string
          title: Lang
          default: en
      type: object
      required:
      - prompt
      title: AnalyzeIn
    AskIn:
      properties:
        question:
          type: string
          minLength: 1
          title: Question
        lang:
          type: string
          title: Lang
          default: en
      type: object
      required:
      - question
      title: AskIn
    CategoryOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        color:
          type: string
          title: Color
      type: object
      required:
      - id
      - name
      - color
      title: CategoryOut
    CollectionIn:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        description:
          type: string
          title: Description
          default: ''
      type: object
      required:
      - name
      title: CollectionIn
    CollectionOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        item_ids:
          items:
            type: integer
          type: array
          title: Item Ids
        item_count:
          type: integer
          title: Item Count
      type: object
      required:
      - id
      - name
      - description
      - item_ids
      - item_count
      title: CollectionOut
    ExportIn:
      properties:
        collection_ids:
          items:
            type: integer
          type: array
          title: Collection Ids
        mode:
          type: string
          enum:
          - single
          - zip
          title: Mode
          default: single
      type: object
      required:
      - collection_ids
      title: ExportIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImproveIn:
      properties:
        prompt:
          type: string
          minLength: 1
          title: Prompt
        lang:
          type: string
          title: Lang
          default: en
      type: object
      required:
      - prompt
      title: ImproveIn
    ItemIdsIn:
      properties:
        item_ids:
          items:
            type: integer
          type: array
          title: Item Ids
      type: object
      required:
      - item_ids
      title: ItemIdsIn
    ItemIn:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        prompt:
          type: string
          title: Prompt
          default: ''
        response:
          type: string
          title: Response
          default: ''
        source:
          type: string
          title: Source
          default: Other
        notes:
          type: string
          title: Notes
          default: ''
        is_favorite:
          type: boolean
          title: Is Favorite
          default: false
        category_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Category Id
        tag_ids:
          items:
            type: integer
          type: array
          title: Tag Ids
          default: []
      type: object
      required:
      - title
      title: ItemIn
    ItemOut:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        prompt:
          type: string
          title: Prompt
        response:
          type: string
          title: Response
        source:
          type: string
          title: Source
        notes:
          type: string
          title: Notes
        is_favorite:
          type: boolean
          title: Is Favorite
        category:
          anyOf:
          - $ref: '#/components/schemas/CategoryOut'
          - type: 'null'
        tags:
          items:
            $ref: '#/components/schemas/TagOut'
          type: array
          title: Tags
          default: []
        collection_ids:
          items:
            type: integer
          type: array
          title: Collection Ids
          default: []
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - title
      - prompt
      - response
      - source
      - notes
      - is_favorite
      - created_at
      - updated_at
      title: ItemOut
    MergeIn:
      properties:
        into_id:
          type: integer
          title: Into Id
      type: object
      required:
      - into_id
      title: MergeIn
    NamedIn:
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
      type: object
      required:
      - name
      title: NamedIn
    NamedPatch:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 80
            minLength: 1
          - type: 'null'
          title: Name
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
      type: object
      title: NamedPatch
    ParseIn:
      properties:
        raw:
          type: string
          minLength: 1
          title: Raw
        lang:
          type: string
          title: Lang
          default: en
      type: object
      required:
      - raw
      title: ParseIn
    TagOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        color:
          type: string
          title: Color
      type: object
      required:
      - id
      - name
      - color
      title: TagOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
