              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      summary: Update Collection
      operationId: update_collection_api_collections__col_id__put
      parameters:
      - name: col_id
        in: path
        required: true
        schema:
          type: integer
          title: Col Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
