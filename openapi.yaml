  /api/categories:
    get:
      summary: List Categories
      operationId: list_categories_api_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryOut'
                type: array
                title: Response List Categories Api Categories Get
    post:
      summary: Create Category
      operationId: create_category_api_categories_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamedIn'
        required: true
      responses:
