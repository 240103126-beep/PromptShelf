components:
  schemas:
    AnalyzeIn:
      properties:
        prompt:
          type: string
          title: Prompt
          default: ''
        response:
          type: string
          title: Response
          default: ''
        locale:
          type: string
          enum:
          - en
          - ru
          - kk
          title: Locale
          default: en
      type: object
      title: AnalyzeIn
    AskIn:
      properties:
        question:
          type: string
          minLength: 1
          title: Question
        history:
          items:
            additionalProperties: true
            type: object
          type: array
          title: History
        locale:
          type: string
          enum:
          - en
          - ru
          - kk
          title: Locale
          default: en
      type: object
      required:
      - question
      title: AskIn
    BatchIn:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ItemIn'
          type: array
          title: Items
      type: object
      required:
      - items
      title: BatchIn
    BulkIn:
      properties:
        ids:
          items:
            type: string
          type: array
          title: Ids
        patch:
          $ref: '#/components/schemas/BulkPatch'
      type: object
      required:
      - ids
      - patch
      title: BulkIn
    BulkPatch:
      properties:
        favorite:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Favorite
        addTagIds:
          items:
            type: string
          type: array
          title: Addtagids
        addCollectionIds:
          items:
            type: string
          type: array
          title: Addcollectionids
        removeCollectionIds:
          items:
            type: string
          type: array
          title: Removecollectionids
      type: object
      title: BulkPatch
    CollectionIn:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        description:
          type: string
          title: Description
          default: ''
      type: object
      required:
      - name
      title: CollectionIn
    CollectionOut:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        description:
          type: string
          title: Description
          default: ''
        id:
          type: string
          title: Id
        createdAt:
          type: string
          format: date-time
          title: Createdat
        itemCount:
          type: integer
          title: Itemcount
      type: object
      required:
      - name
      - id
      - createdAt
      - itemCount
      title: CollectionOut
    CollectionPatch:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      title: CollectionPatch
    ExportIn:
      properties:
        collectionIds:
          items:
            type: string
          type: array
          title: Collectionids
        format:
          type: string
          enum:
          - md
          - zip
          title: Format
          default: md
      type: object
      required:
      - collectionIds
      title: ExportIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImproveIn:
      properties:
        prompt:
          type: string
          minLength: 1
          title: Prompt
        locale:
          type: string
          enum:
          - en
          - ru
          - kk
          title: Locale
          default: en
      type: object
      required:
      - prompt
      title: ImproveIn
    ItemIdsIn:
      properties:
        ids:
          items:
            type: string
          type: array
          title: Ids
      type: object
      required:
      - ids
      title: ItemIdsIn
    ItemIn:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        prompt:
          type: string
          title: Prompt
          default: ''
        response:
          type: string
          title: Response
          default: ''
        source:
          type: string
          enum:
          - chatgpt
          - claude
          - gemini
          - other
          title: Source
          default: other
        notes:
          type: string
          title: Notes
          default: ''
        favorite:
          type: boolean
          title: Favorite
          default: false
        categoryId:
          anyOf:
          - type: string
          - type: 'null'
          title: Categoryid
        tagIds:
          items:
            type: string
          type: array
          title: Tagids
        collectionIds:
          items:
            type: string
          type: array
          title: Collectionids
      type: object
      required:
      - title
      title: ItemIn
    ItemOut:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        prompt:
          type: string
          title: Prompt
          default: ''
        response:
          type: string
          title: Response
          default: ''
        source:
          type: string
          enum:
          - chatgpt
          - claude
          - gemini
          - other
          title: Source
          default: other
        notes:
          type: string
          title: Notes
          default: ''
        favorite:
          type: boolean
          title: Favorite
          default: false
        categoryId:
          anyOf:
          - type: string
          - type: 'null'
          title: Categoryid
        tagIds:
          items:
            type: string
          type: array
          title: Tagids
        collectionIds:
          items:
            type: string
          type: array
          title: Collectionids
        id:
          type: string
          title: Id
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
      type: object
      required:
      - title
      - id
      - createdAt
      - updatedAt
      title: ItemOut
    ItemPatch:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Title
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
        response:
          anyOf:
          - type: string
          - type: 'null'
          title: Response
        source:
          anyOf:
          - type: string
            enum:
            - chatgpt
            - claude
            - gemini
            - other
          - type: 'null'
          title: Source
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        favorite:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Favorite
        categoryId:
