          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/collections/{col_id}/items:
    post:
      summary: Add Items
      operationId: add_items_api_collections__col_id__items_post
      parameters:
      - name: col_id
        in: path
        required: true
        schema:
          type: integer
          title: Col Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemIdsIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/collections/{col_id}/items/{item_id}:
    delete:
      summary: Remove Item
      operationId: remove_item_api_collections__col_id__items__item_id__delete
      parameters:
      - name: col_id
        in: path
        required: true
        schema:
          type: integer
          title: Col Id
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/export:
    post:
      summary: Export
      operationId: export_api_export_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/import/parse:
    post:
      summary: Import Parse
      operationId: import_parse_api_import_parse_post
      requestBody:
        content:
          application/json:
            schema:
