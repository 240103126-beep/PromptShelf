# Optional Docker-based preview. Render does not execute docker-compose.yaml.
# Both plans are explicitly free. Do not upgrade plans automatically.
services:
  - type: web
    name: promptshelf
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: '8000'
      - key: DATABASE_URL
        fromDatabase:
          name: promptshelf-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SEED
        value: '1'
databases:
  - name: promptshelf-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'
    databaseName: promptshelf
    user: promptshelf
    ipAllowList: []
